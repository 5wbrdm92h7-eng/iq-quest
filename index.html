<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101a">
  <meta name="description" content="IQ QUEST – Löse drei Rätsel und entdecke den verlorenen Solana-Schatz.">
  <title>IQ QUEST — Der verschwundene Solana-Schatz</title>
  <style>
    :root{color-scheme:dark;--bg:#070d17;--panel:#0e1b2c;--panel2:#11233a;--text:#ecf7ff;--muted:#9bb2c7;--mint:#4ceac7;--aqua:#2bc5f0;--gold:#ffd369;--line:#27415a;--danger:#ff8590;--shadow:0 22px 70px rgba(0,0,0,.32)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% -100px,#133454 0%,transparent 48%),#070d17;color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.48}
    button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}a{color:var(--mint)}
    .app{max-width:1000px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(18px,4vw,34px);gap:12px;border-bottom:1px solid #24344788;background:#07101bb3;backdrop-filter:blur(10px)}
    .brand{font-family:Georgia,serif;font-size:24px;letter-spacing:-1px;font-weight:700;color:#eafcff}.brand b{color:var(--aqua);font-weight:700}.topnav{display:flex;align-items:center;gap:8px}.navbtn{border:1px solid #34536b;color:var(--text);background:#122338;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700}.navbtn.active{color:#071520;background:var(--mint);border-color:var(--mint)}
    #screen{flex:1}.content{max-width:760px;margin:0 auto;padding:30px 20px 80px}.center{text-align:center}.eyebrow{color:var(--mint);letter-spacing:2.8px;text-transform:uppercase;font-size:11px;font-weight:800}.lead{color:var(--muted);font-size:16px;max-width:590px;margin:14px auto 0}.hero{padding:35px 20px 60px;text-align:center;position:relative;overflow:hidden;background:radial-gradient(ellipse 70% 45% at 50% 63%,#105a6d55,transparent 75%)}
    .hero h1{margin:0;font-family:Georgia,serif;font-size:clamp(52px,10vw,98px);line-height:.88;letter-spacing:-3px;text-shadow:0 2px 30px #02daff37}.hero h1 span{color:var(--aqua);display:block}.hero h1 em{font-style:normal;color:var(--gold)}
    .land{display:block;margin:18px auto 0;width:min(100%,640px);height:auto;filter:drop-shadow(0 18px 32px #0008)}
    .panel{background:linear-gradient(142deg,#11263b 0%,#0c1828 75%);border:1px solid var(--line);border-radius:21px;padding:22px;box-shadow:var(--shadow)}
    .button{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:none;border-radius:14px;min-height:52px;padding:12px 23px;color:#05202a;font-size:15px;font-weight:850;background:linear-gradient(120deg,#65f4d1,#2bc5c3);box-shadow:0 8px 25px #14e7ce24;transition:transform .15s ease,filter .15s ease}.button:active{transform:translateY(2px)}.button:hover{filter:brightness(1.06)}.button.secondary{color:#e9faff;background:#122941;border:1px solid #3c6480;box-shadow:none}.button.gold{background:linear-gradient(120deg,#ffdd7b,#f0b440)}.button.ghost{background:transparent;border:1px solid #34556e;color:var(--text);box-shadow:none}.button.small{min-height:40px;font-size:13px;padding:8px 14px}.button.full{width:100%}.hero .button{margin-top:23px;width:min(100%,360px)}
    .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px auto 0;max-width:500px}.quick .tiny{font-size:13px;color:#b4cada}.quick svg{display:block;margin:0 auto 6px;color:var(--gold)}
    .section-label{color:#eaf5ff;font-weight:850;letter-spacing:.25px;margin:20px 0 14px;font-size:18px}.quest-card{display:grid;grid-template-columns:142px 1fr;overflow:hidden;padding:0;align-items:stretch}.quest-art{background:radial-gradient(circle at 50% 42%,#49ffff66,transparent 40%),linear-gradient(120deg,#124456,#06111e);min-height:186px;display:grid;place-items:center}.quest-art svg{width:110px;height:110px}.quest-info{padding:18px 18px 18px 22px}.quest-info h3{font-family:Georgia,serif;font-size:21px;margin:6px 0}.quest-info p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 15px}.chip{display:inline-flex;align-items:center;gap:5px;color:#041d17;background:var(--mint);border-radius:30px;padding:3px 9px;font-size:11px;font-weight:800}.tags{display:flex;flex-wrap:wrap;gap:13px;color:#93bdd0;font-size:12px;margin-bottom:17px}
    .breadcrumb{margin:24px 0 14px;color:var(--muted);font-size:13px}.top-steps{display:flex;align-items:center;justify-content:center;gap:10px;margin:17px 0 25px}.step{border:1px solid #3c5c76;border-radius:99px;background:#14283a;width:36px;height:36px;display:grid;place-items:center;font-weight:850;color:#aec4d4}.step.done{background:#30d4a9;color:#06241b;border-color:#30d4a9}.step.current{box-shadow:0 0 0 4px #26dcc32a;border-color:var(--mint);color:var(--mint)}.stem{width:35px;height:2px;background:#2a5364}.stem.done{background:var(--mint)}
    .quest-title{font-family:Georgia,serif;font-size:clamp(31px,6vw,47px);line-height:1.05;margin:12px 0}.story{max-width:550px;margin:10px auto 22px;color:var(--muted)}.art-wrap{position:relative;margin:20px auto 22px;max-width:650px;overflow:hidden;border-radius:22px;border:1px solid #265268;background:linear-gradient(#14324c,#081726)}.art-wrap svg{width:100%;display:block;height:auto}.art-label{position:absolute;top:15px;left:15px;background:#091724cc;border:1px solid #35576f;color:#b8e9ec;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:700}
    .challenge{background:linear-gradient(160deg,#14293f,#0b1828);border:1px solid #2b4e68;border-radius:22px;padding:24px}.challenge h2{font-family:Georgia,serif;font-size:26px;margin:5px 0 16px}.stone{background:linear-gradient(130deg,#284555,#183240);border:1px solid #497387;border-radius:16px;box-shadow:inset 0 0 35px #07131a88,0 15px 32px #0005;padding:22px 16px;margin:0 auto 18px;font-family:Georgia,serif;text-align:center;font-size:clamp(18px,4.5vw,25px);line-height:1.55;color:#ffebc4}.label{display:block;text-align:left;color:#b5cad6;font-size:13px;font-weight:750;margin:14px 0 8px}.field{appearance:none;background:#091624;border:1px solid #3a6077;border-radius:13px;color:#f0faff;width:100%;min-height:53px;padding:12px 14px;font-size:16px}.field::placeholder{color:#7391a4}.field.long{min-height:83px;resize:vertical}.field:focus{border-color:var(--mint)}.control-row{display:flex;gap:10px;margin-top:12px}.control-row>*{flex:1}.hint{background:#4fe9be0b;border:1px solid #337e78;border-radius:12px;color:#c4f7e4;padding:12px;margin:12px 0;line-height:1.5;text-align:left}.error{color:#ffc0c4;font-size:13px;margin:8px 0;text-align:left}.small-note{font-size:12px;color:#88aabd;line-height:1.5}.success-circle{width:106px;height:106px;border:3px solid var(--mint);border-radius:50%;display:grid;place-items:center;margin:15px auto;color:var(--mint);font-size:58px;box-shadow:0 0 0 12px #29e6ae12,0 0 55px #24ecba44}
    .win h1{color:var(--gold);font-family:Georgia,serif;font-size:48px;margin:20px 0 10px}.reward{border:1px solid #786239;background:linear-gradient(145deg,#291e12,#142331);padding:20px;border-radius:18px;max-width:480px;margin:20px auto;text-align:left}.reward strong{color:var(--gold)}
    .editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-section{margin:19px 0;padding-top:16px;border-top:1px solid #2c485b}.form-section h3{margin:0 0 8px;font-family:Georgia,serif}.notice{background:#312a1b;border:1px solid #735c2f;color:#ffe4ac;border-radius:14px;padding:14px 16px;font-size:13px;line-height:1.55;margin:14px 0}.upload{width:100%;padding:10px;color:var(--text);border:1px dashed #51718a;border-radius:12px;background:#0b1c2b}.tool-buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.tool-buttons button{flex:1;min-width:130px}.bytes{display:inline-block;border:1px solid #35536a;border-radius:99px;padding:4px 10px;color:#9dcde0;font-size:12px}
    .footer{padding:20px 18px calc(20px + env(safe-area-inset-bottom));text-align:center;border-top:1px solid #183047;font-size:12px;color:#7597ac}.footer strong{color:var(--mint)}
    @media(max-width:580px){.topbar{padding:13px 15px}.brand{font-size:20px}.navbtn{padding:8px 10px;font-size:12px}.hero{padding-top:34px}.hero h1{font-size:65px}.quest-card{grid-template-columns:1fr}.quest-art{min-height:135px}.quest-art svg{height:120px}.quest-info{padding:18px}.editor-grid{grid-template-columns:1fr}.content{padding:24px 16px 55px}.challenge{padding:18px}.control-row{flex-direction:column}.control-row>*{width:100%}.land{margin-top:7px}.quick{margin-top:14px}.win h1{font-size:42px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="brand">IQ <b>QUEST</b></div><nav class="topnav" aria-label="Hauptnavigation"><button class="navbtn" id="home-btn">Spielen</button><button class="navbtn" id="editor-btn">Erstellen</button></nav></header>
  <main id="screen" aria-live="polite"></main>
  <footer class="footer"><strong>IQ QUEST</strong> · Version 1 · Kostenlos spielbar · Fortschritt nur auf diesem Gerät · Noch keine On-Chain-Verbindung</footer>
</div>
<script>
'use strict';
const DEFAULT_QUEST={v:1,title:'Der verschwundene Solana-Schatz',intro:'Ein Entwickler hat drei Hinweise in einem vergessenen Tempel hinterlassen. Löse alle Rätsel und öffne den Tresor.',levels:[
  {title:'Die geheime Nachricht',question:'Ich habe Tasten, aber keine Türen. Ich habe eine Leertaste, aber keinen Raum. Was bin ich?',hint:'Du benutzt mich zum Schreiben.',answer:'Tastatur'},
  {title:'Der Zahlencode',question:'Auf dem Bildschirm steht: 2 – 4 – 8 – 16 – ?',hint:'Jede Zahl ist doppelt so groß wie die vorherige.',answer:'32'},
  {title:'Das letzte Wort',question:'Ordne die Zeichen neu: A N A L O S. Welches Blockchain-Netzwerk ist gemeint?',hint:'Der Name beginnt mit S und endet mit A.',answer:'Solana'}
]};
const SAVE='iqquest.v1.saved', DRAFT='iqquest.v1.draft', PROGRESS='iqquest.v1.progress';
const screen=document.querySelector('#screen');
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(k,fallback)=>{try{return JSON.parse(localStorage.getItem(k))??fallback}catch(e){return fallback}};
const persist=(k,value)=>{try{localStorage.setItem(k,JSON.stringify(value));return true}catch(e){return false}};
const textBytes=s=>new TextEncoder().encode(s).length;
const normalize=s=>String(s).normalize('NFKC').trim().toLocaleLowerCase('de-DE').replace(/\s+/g,' ');
function validQuest(x){return !!x&&x.v===1&&typeof x.title==='string'&&x.title.trim()&&x.title.length<=100&&typeof x.intro==='string'&&x.intro.length<=400&&Array.isArray(x.levels)&&x.levels.length===3&&x.levels.every(l=>l&&['title','question','hint','answer'].every(k=>typeof l[k]==='string'&&l[k].trim()&&l[k].length<=450));}
let quest=load(SAVE,DEFAULT_QUEST);if(!validQuest(quest))quest=structuredClone(DEFAULT_QUEST);
let level=Math.min(Math.max(Number(load(PROGRESS,0))||0,0),3),view='home',showHint=false,message='',answerInput='';
const portalSVG=`<svg class="land" viewBox="0 0 700 360" role="img" aria-label="Geheimnisvoller Tempel mit leuchtendem Schatzportal"><defs><radialGradient id="glow"><stop stop-color="#3af9f2" stop-opacity=".72"/><stop offset="1" stop-color="#3af9f2" stop-opacity="0"/></radialGradient><linearGradient id="stone" x2="0" y2="1"><stop stop-color="#295b69"/><stop offset="1" stop-color="#0a1c32"/></linearGradient></defs><path d="M0 332Q122 270 210 314T419 297T700 330V360H0Z" fill="#0c2435"/><ellipse cx="355" cy="193" rx="180" ry="155" fill="url(#glow)"/><path d="M213 301V145L254 112L285 135V302M417 301V135L450 112L486 147V301" fill="url(#stone)" stroke="#437684" stroke-width="5"/><path d="M292 300V117Q350 44 410 117V300Z" fill="#102f45" stroke="#649caa" stroke-width="6"/><path d="M318 283V134Q351 91 385 134V283Z" fill="#071826" stroke="#53e0e2" stroke-width="6"/><path d="M329 256L343 225L351 238L369 197L384 254Z" fill="#60efe6" opacity=".8"/><path d="M300 114L351 72L404 114" fill="none" stroke="#b1c3b5" stroke-width="12"/><path d="M252 285V169M450 285V169" stroke="#5f838b" stroke-width="11"/><path d="M170 322l12-78l32-16l12 94M492 322l12-78l32-16l12 94" fill="#123f3e"/><circle cx="351" cy="121" r="14" fill="#ffd369"/><g fill="#ffd369"><circle cx="170" cy="95" r="3"/><circle cx="530" cy="105" r="2"/><circle cx="550" cy="170" r="3"/><circle cx="148" cy="192" r="2"/></g><path d="M0 345Q100 320 200 345T420 340T700 340" fill="none" stroke="#18525c" stroke-width="6"/></svg>`;
const chestSVG=`<svg viewBox="0 0 650 350" role="img" aria-label="Leuchtende goldene Schatztruhe"><defs><radialGradient id="goldGlow"><stop stop-color="#ffc96c" stop-opacity=".8"/><stop offset="1" stop-color="#ffc96c" stop-opacity="0"/></radialGradient></defs><rect width="650" height="350" fill="#0a1928"/><ellipse cx="325" cy="165" rx="218" ry="170" fill="url(#goldGlow)"/><path d="M186 164Q198 96 319 95Q444 100 465 164L451 194L196 194Z" fill="#946027" stroke="#ffde89" stroke-width="11"/><path d="M180 195L474 195L451 295L207 295Z" fill="#5f3b21" stroke="#ffcb61" stroke-width="11"/><path d="M199 205L450 205M221 248L433 248" stroke="#efb750" stroke-width="10"/><rect x="301" y="188" width="44" height="68" rx="9" fill="#ffd769"/><circle cx="324" cy="222" r="9" fill="#754522"/><path d="M327 62V26M218 94L194 57M433 90L458 48M149 202L104 184M509 202L554 184" stroke="#ffdd79" stroke-width="8" stroke-linecap="round"/><g fill="#fff0a6"><circle cx="272" cy="69" r="5"/><circle cx="390" cy="34" r="4"/><circle cx="120" cy="105" r="3"/><circle cx="514" cy="120" r="6"/></g></svg>`;
const levelArt=[`<svg viewBox="0 0 650 290" role="img" aria-label="Alte Steintafel vor einem Tempel"><defs><linearGradient id="g1" x2="0" y2="1"><stop stop-color="#214e5c"/><stop offset="1" stop-color="#091b2f"/></linearGradient></defs><rect width="650" height="290" fill="url(#g1)"/><path d="M0 260L115 158L193 240L285 126L381 238L477 144L650 250V290H0" fill="#0c2835"/><rect x="209" y="50" width="232" height="212" rx="14" fill="#4d6669" stroke="#94b5af" stroke-width="11"/><path d="M239 74H414M239 240H412" stroke="#778f8b" stroke-width="5"/><path d="M309 95L330 116L350 95M286 150L325 190L366 150" stroke="#f9d596" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="326" cy="202" r="10" fill="#67e2dc"/><path d="M83 290V155M564 290V170" stroke="#1a5955" stroke-width="25"/></svg>`, `<svg viewBox="0 0 650 290" role="img" aria-label="Futuristisches Terminal mit Zahlencode"><rect width="650" height="290" fill="#071926"/><path d="M0 250L90 150L170 225L275 160L410 245L510 150L650 250V290H0" fill="#0f394a"/><rect x="105" y="50" width="440" height="195" rx="15" fill="#092337" stroke="#42bde5" stroke-width="6"/><rect x="127" y="71" width="396" height="149" rx="6" fill="#051627"/><text x="325" y="155" fill="#4de2fb" font-size="36" font-weight="bold" text-anchor="middle" font-family="monospace">2 · 4 · 8 · 16 · ?</text><path d="M156 192H493" stroke="#24536b" stroke-width="3"/><g stroke="#16465b"><path d="M140 85H512M140 100H512M140 115H512M140 130H512M140 145H512M140 160H512M140 175H512M140 190H512" opacity=".2"/></g></svg>`, `<svg viewBox="0 0 650 290" role="img" aria-label="Mystisches Solana-Rune-Rätsel"><rect width="650" height="290" fill="#071924"/><path d="M0 274L119 157L206 254L350 135L478 235L560 120L650 240V290H0" fill="#11323f"/><rect x="97" y="43" width="456" height="214" rx="16" fill="#263e43" stroke="#d5a963" stroke-width="7"/><path d="M128 66H520M128 232H520" stroke="#997349" stroke-width="5"/><text x="325" y="164" fill="#ffdf92" font-size="52" text-anchor="middle" font-family="Georgia,serif" letter-spacing="12">ANALOS</text><circle cx="324" cy="78" r="9" fill="#ffd572"/></svg>`];
function header(active){document.querySelector('#home-btn').classList.toggle('active',active==='home');document.querySelector('#editor-btn').classList.toggle('active',active==='editor');}
function go(next){view=next;message='';answerInput='';showHint=false;render();scrollTo({top:0,behavior:'smooth'});}
function tags(){return `<div class="tags"><span>◈ 3 Stationen</span><span>◷ ca. 5 Minuten</span><span>◇ Für Einsteiger</span></div>`}
function renderHome(){header('home');screen.innerHTML=`<section class="hero"><div class="eyebrow">ENTDECKE • DENKE • ENTSCHLÜSSELE</div>${portalSVG}<h1><span>IQ</span><em>QUEST</em></h1><p class="lead">Finde die Hinweise. Löse die Rätsel.<br>Entdecke den vergessenen Schatz.</p><button id="hero-start" class="button gold">${level===3?'Noch einmal spielen':'Abenteuer starten'} &nbsp; ↗</button><div class="quick"><div class="tiny">✦<br>Rätsel lösen</div><div class="tiny">⌖<br>Hinweise finden</div><div class="tiny">♕<br>Schatz entdecken</div></div></section><div class="content"><div class="section-label">Dein erstes Abenteuer</div><article class="panel quest-card"><div class="quest-art">${portalSVG}</div><div class="quest-info"><span class="chip">EINSTEIGER</span><h3>${safe(quest.title)}</h3><p>${safe(quest.intro)}</p>${tags()}<button id="card-start" class="button small">${level===3?'Erneut starten':level>0?'Weiterspielen':'Quest starten'} →</button></div></article><div class="notice">Diese Version ist eine echte, lokal spielbare Demo. Die Rätsel und Antworten liegen aktuell im Seiten-Code bzw. im Browser, <b>noch nicht auf Solana</b>. Es gibt keine echten NFTs oder Geldgewinne.</div></div>`;document.querySelector('#hero-start').onclick=startGame;document.querySelector('#card-start').onclick=startGame;}
function startGame(){if(level===3){level=0;persist(PROGRESS,0)}go('game')}
function steps(){return `<div class="top-steps" aria-label="Spielfortschritt">${[0,1,2].map((n)=>`${n>0?`<div class="stem ${n<=level?'done':''}"></div>`:''}<div class="step ${n<level?'done':n===level?'current':''}" aria-label="Station ${n+1}">${n<level?'✓':n+1}</div>`).join('')}</div>`}
function renderGame(){header('home');if(level>=3){go('win');return}const l=quest.levels[level];screen.innerHTML=`<div class="content center"><div class="breadcrumb">IQ QUEST / ${safe(quest.title)}</div><div class="eyebrow">STATION ${level+1} VON 3</div>${steps()}<h1 class="quest-title">${safe(l.title)}</h1><p class="story">${['Vor einem verschlossenen Tor entdeckst du eine alte Inschrift.','Ein Terminal erwacht zum Leben. Nur die nächste Zahl öffnet die Tür.','Ein letzter Steinblock versperrt den Weg zum Schatz.'][level]}</p><div class="art-wrap"><span class="art-label">${['ALTE RUINEN','GEHEIMES TERMINAL','LETZTES SIEGEL'][level]}</span>${levelArt[level]}</div><section class="challenge"><div class="eyebrow">DAS RÄTSEL</div><h2>${safe(l.title)}</h2><div class="stone">${safe(l.question)}</div><form id="answer-form"><label class="label" for="player-answer">Deine Antwort</label><input id="player-answer" class="field" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Lösung hier eingeben …" required maxlength="100"><div id="feedback" aria-live="polite"></div><div class="control-row"><button type="button" id="hint-btn" class="button secondary">💡 Hinweis anzeigen</button><button type="submit" class="button">Antwort prüfen →</button></div></form></section><p class="small-note">Falsche Antworten kosten nichts. Kein Wallet nötig.</p><button id="quit-btn" class="button ghost small" style="margin-top:8px">← Zur Übersicht</button></div>`;const form=screen.querySelector('#answer-form');const input=screen.querySelector('#player-answer');form.onsubmit=e=>{e.preventDefault();let raw=input.value;const accepted=l.answer.split('|').map(x=>normalize(x));if(accepted.includes(normalize(raw))){level++;persist(PROGRESS,level);answerInput='';go(level>=3?'win':'solved')}else{const f=screen.querySelector('#feedback');f.innerHTML='<p class="error" role="alert">Noch nicht richtig. Prüfe die Schreibweise oder benutze den Hinweis.</p>';input.focus()}};screen.querySelector('#hint-btn').onclick=()=>{screen.querySelector('#feedback').innerHTML=`<div class="hint"><b>💡 Hinweis:</b> ${safe(l.hint)}</div>`};screen.querySelector('#quit-btn').onclick=()=>go('home')}
function renderSolved(){header('home');const just=quest.levels[level-1];screen.innerHTML=`<div class="content center" style="padding-top:65px"><div class="eyebrow">STATION ${level} GESCHAFFT</div>${steps()}<div class="success-circle">✓</div><h1 class="quest-title" style="color:var(--mint)">Richtig gelöst!</h1><p class="lead">Du hast „${safe(just.title)}“ erfolgreich gemeistert. ${3-level} ${3-level===1?'Station wartet':'Stationen warten'} noch auf dich.</p><button id="continue-btn" class="button full" style="max-width:350px;margin-top:25px">Weiter zur nächsten Station →</button><div style="margin-top:20px"><button id="pause-btn" class="button ghost small">Quest später fortsetzen</button></div></div>`;screen.querySelector('#continue-btn').onclick=()=>go('game');screen.querySelector('#pause-btn').onclick=()=>go('home')}
function renderWin(){header('home');screen.innerHTML=`<div class="content center win"><div class="eyebrow">ALLE 3 STATIONEN GESCHAFFT</div><div class="art-wrap" style="margin-top:20px">${chestSVG}</div><h1>Schatz gefunden!</h1><p class="lead">Glückwunsch! Du hast alle Rätsel entschlüsselt und den geheimen Tresor geöffnet.</p><div class="reward"><strong>🏆 Deine Demo-Auszeichnung</strong><p>„Genesis Explorer“ — du hast IQ QUEST erfolgreich abgeschlossen.</p><p class="small-note">Dies ist ein <b>lokaler Spiel-Erfolg</b>, kein NFT und kein on-chain verifizierter Nachweis.</p></div><div style="display:grid;gap:10px;max-width:390px;margin:20px auto"><button id="restart-btn" class="button gold">↺ Erneut spielen</button><button id="share-btn" class="button secondary">↗ Link zur Challenge teilen</button><button id="back-btn" class="button ghost">Zur Startseite</button></div><p id="share-result" class="small-note"></p></div>`;screen.querySelector('#restart-btn').onclick=()=>{level=0;persist(PROGRESS,0);go('game')};screen.querySelector('#back-btn').onclick=()=>go('home');screen.querySelector('#share-btn').onclick=async()=>{const url=location.href.split('#')[0].split('?')[0];try{if(navigator.share){await navigator.share({title:'IQ QUEST – Rätsel-Challenge',text:'Schaffst du alle drei Stationen?',url})}else if(navigator.clipboard){await navigator.clipboard.writeText(url);screen.querySelector('#share-result').textContent='Der Link wurde kopiert.'}else{screen.querySelector('#share-result').textContent='Teile diesen Link: '+url}}catch(e){if(e.name!=='AbortError')screen.querySelector('#share-result').textContent='Bitte kopiere die Adresse oben im Browser.'}}}
function renderEditor(){header('editor');let draft=load(DRAFT,quest);if(!validQuest(draft))draft=structuredClone(quest);const fields=(l,i)=>`<div class="form-section"><h3>Station ${i+1}</h3><label class="label" for="title${i}">Titel</label><input id="title${i}" class="field" data-idx="${i}" data-prop="title" value="${safe(l.title)}" maxlength="100"><label class="label" for="question${i}">Rätselfrage</label><textarea id="question${i}" class="field long" data-idx="${i}" data-prop="question" maxlength="450">${safe(l.question)}</textarea><div class="editor-grid"><div><label class="label" for="hint${i}">Hinweis</label><textarea id="hint${i}" class="field long" data-idx="${i}" data-prop="hint" maxlength="450">${safe(l.hint)}</textarea></div><div><label class="label" for="answer${i}">Richtige Antwort</label><input id="answer${i}" class="field" data-idx="${i}" data-prop="answer" maxlength="100"><p class="small-note">Für mehrere richtige Schreibweisen trenne Antworten mit | (z. B. Tastatur|Keyboard).</p></div></div></div>`;screen.innerHTML=`<div class="content"><div class="eyebrow">DEIN EIGENES ABENTEUER</div><h1 class="quest-title">Quest-Editor</h1><p class="lead" style="margin:0 0 20px">Erstelle drei eigene Rätsel und teste sie direkt auf deinem iPhone. Du brauchst dafür keine Programmierkenntnisse.</p><div class="notice"><b>Noch keine Blockchain-Veröffentlichung:</b> Der Editor speichert lokal im Browser. Über „JSON herunterladen“ kannst du deine Quest für einen späteren IQ-Labs-Upload vorbereiten. Keine Wallet-Daten oder privaten Schlüssel eingeben.</div><section class="panel"><label class="label" for="etitle">Name des Abenteuers</label><input id="etitle" class="field" maxlength="100" value="${safe(draft.title)}"><label class="label" for="eintro">Beschreibung</label><textarea id="eintro" class="field long" maxlength="400">${safe(draft.intro)}</textarea>${draft.levels.map(fields).join('')}<p><span id="byte-count" class="bytes"></span></p><p class="small-note">Der Byte-Wert zählt nur deine Quest-JSON-Datei, nicht die ganze Webseite oder später benötigte Blockchain-Metadaten.</p><div class="tool-buttons"><button id="test-btn" class="button">Quest speichern & spielen</button><button id="export-btn" class="button secondary">JSON herunterladen</button><button id="reset-btn" class="button ghost">Beispiel wiederherstellen</button></div><div id="editor-msg" role="status" class="small-note" style="margin-top:15px"></div><div class="form-section"><h3>Bestehende Quest importieren</h3><p class="small-note">Importiere eine passende JSON-Datei, zum Beispiel nach der Bearbeitung mit ChatGPT.</p><input type="file" id="import-file" class="upload" accept=".json,application/json"></div></section></div>`;screen.querySelectorAll('[data-idx]').forEach(el=>{if(el.dataset.prop==='answer')el.value=draft.levels[+el.dataset.idx].answer});const current=()=>({v:1,title:screen.querySelector('#etitle').value.trim(),intro:screen.querySelector('#eintro').value.trim(),levels:[0,1,2].map(i=>Object.fromEntries(['title','question','hint','answer'].map(k=>[k,screen.querySelector(`[data-idx="${i}"][data-prop="${k}"]`).value.trim()]))) });const updateBytes=()=>{const v=current();const bytes=textBytes(JSON.stringify(v));const e=screen.querySelector('#byte-count');e.textContent=`${bytes} Bytes Quest-Daten`;e.style.color=bytes>650?'#ffca83':'#9dcde0';persist(DRAFT,v)};screen.querySelectorAll('input,textarea').forEach(el=>el.addEventListener('input',updateBytes));updateBytes();const msg=txt=>{screen.querySelector('#editor-msg').textContent=txt};screen.querySelector('#test-btn').onclick=()=>{let data=current();if(!validQuest(data)){msg('Bitte alle Felder ausfüllen. Drei Stationen mit je einer Antwort sind nötig.');return}quest=data;persist(SAVE,quest);persist(DRAFT,quest);level=0;persist(PROGRESS,0);go('home')};screen.querySelector('#export-btn').onclick=()=>{const data=current();if(!validQuest(data)){msg('Bitte erst alle Felder ausfüllen.');return}const blob=new Blob([JSON.stringify(data)],{type:'application/json;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='iq-quest-spiel.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);msg('Die JSON-Datei wurde zum Herunterladen angeboten.')};screen.querySelector('#reset-btn').onclick=()=>{if(confirm('Deine lokale Quest durch die Beispielquest ersetzen?')){localStorage.removeItem(DRAFT);localStorage.removeItem(SAVE);localStorage.removeItem(PROGRESS);quest=structuredClone(DEFAULT_QUEST);level=0;renderEditor()}};screen.querySelector('#import-file').onchange=async e=>{let file=e.target.files[0];if(!file)return;if(file.size>30000){msg('Die Datei ist zu groß (maximal 30 KB).');return}try{const parsed=JSON.parse(await file.text());if(!validQuest(parsed)){msg('Ungültiges Format. Benötigt: v=1, title, intro und genau 3 levels mit title, question, hint, answer.');return}persist(DRAFT,parsed);renderEditor();screen.querySelector('#editor-msg').textContent='Datei importiert. Prüfe die Felder und tippe auf „Quest speichern & spielen“.'}catch(err){msg('Die Datei ist kein gültiges JSON.')}};}
function render(){if(view==='home')renderHome();else if(view==='game')renderGame();else if(view==='solved')renderSolved();else if(view==='win')renderWin();else renderEditor();}
document.querySelector('#home-btn').onclick=()=>go('home');document.querySelector('#editor-btn').onclick=()=>go('editor');render();
</script>
</body>
</html>
